<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - Food Station</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
 
<body>
 
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#"> Food Station</a>
 
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
 
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="home.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about.html">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="contact.html">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
 
<!-- Contact Section -->
<div class="container my-5">
  <h2 class="text-center mb-4">Contact Us</h2>
 
  <div class="row justify-content-center">
    <div class="col-md-6">
 
      <form id="contactForm" class="p-4 border rounded shadow-sm">
 
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="string" class="form-control" id="name">
        </div>
 
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="number" class="form-control" id="phone">
        </div>
 
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email">
        </div>

        <div class="mb-3">
          <label class="form-label">Preffered Contact Hours</label>
          <input type="text" class="form-control" id="contactHours">
        </div>

        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="4"></textarea>
        </div>
 
        <button type="submit" class="btn btn-primary w-100">Send Message</button>
 
        <div id="msg" class="mt-3 text-center"></div>
 
      </form>
 
    </div>
  </div>
</div>
 
<!-- Google Map Section - Wellington CBD -->
<div class="container my-5">
  <h4 class="text-center mb-3">📍 Find Us in Wellington CBD</h4>
 
  <div class="row justify-content-center">
    <div class="col-md-6">
 
      <div class="ratio ratio-16x9 shadow">
        <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d2998.455170711666!2d174.77491517620092!3d-41.27719722131417!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sbeehive!5e0!3m2!1sen!2snz!4v1780363413086!5m2!1sen!2snz"
         width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" >
        </iframe>
      </div>
 
    </div>
  </div>
</div>
 
<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
  © 2026 Food station
</footer>
 
<!-- JavaScript -->
<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
  e.preventDefault();
 
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let email = document.getElementById("email").value;
  let contacthours = document.getElementById("contactHours").value;
  let message = document.getElementById("message").value;
 
  if(name === "" || phone === "" || email === "" || contacthours === "" || message === "") {
    document.getElementById("msg").innerHTML =
      "<span class='text-danger'>Please fill all fields!</span>";
  } else if(isNaN(name)) {
    document.getElementById("msg").innerHTML =
      "<span class='text-danger'>Name cannot be a number!</span>";
  }else {
    document.getElementById("msg").innerHTML =
      "<span class='text-success'>Message sent successfully!</span>";
    document.getElementById("contactForm").reset();
  }
});
</script>

</body>
</html>
