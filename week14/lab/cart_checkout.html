<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Station | Checkout</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="/lab/cart_main.html">🍔 Food Station</a>
            <div class="collapse navbar-collapse" id="foodStationNavbar">
                <ul class="navbar-nav mt-2 mt-lg-1">
                    <li class="nav-item">
                        <a class="nav-link" href="/lab/cart_main.html">Menu</a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link active" href="/lab/cart_checkout.html">Checkout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="text-center mb-4">Checkout</h2>

        <div class="row">

            <!-- Order Summary Box -->
            <div class="col-md-4 mb-4">
                <div class="card p-3">
                    <h4 class="mb-3 text-center">🧾 Order Summary</h4>
                        <tbody id="checkout-body">
                            <tr><td colspan="4" class="text-center text-muted"></td></tr>
                        </tbody>
                    <h5 class="text-center" id="checkout-number">Total Number of Items in Cart: 0</h5>
                    <h5 class="text-center" id="checkout-total">Total: $0.00</h5>
                </div>
            </div>

            <!-- Customer Details Box -->
            <div class="col-md-4 mb-4">
                <div class="card p-3">
                    <h4 class="mb-3">🙍 Customer Details</h4>

                    <div class="mb-3">
                        <label>Full Name</label>
                        <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
                    </div>

                    <div class="mb-3">
                        <label>Phone Number</label>
                        <input type="text" class="form-control" id="phone" placeholder="Enter your phone number">
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="text" class="form-control" id="email" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label>Address</label>
                        <input type="text" class="form-control" id="address" placeholder="Enter your address">
                    </div>

                    <div class="mb-3">
                        <label>Delivery Notes</label>
                        <textarea class="form-control" id="deliveryNotes" placeholder="Any special instructions? (optional)"></textarea>
                    </div>

                </div>
            </div>

            <!-- Payment Box -->
            <div class="col-md-4 mb-4">
                <div class="card p-3">
                    <h4 class="mb-3">💳 Payment Details</h4>

                    <div class="mb-3">
                        <label>Cardholder Name</label>
                        <input type="text" class="form-control" id="cardName" placeholder="Enter name on card">
                    </div>

                    <div class="mb-3">
                        <label>Card Number</label>
                        <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="16">
                    </div>

                    <div class="row">
                        <div class="col mb-3">
                            <label>Expiry Date</label>
                            <input type="text" class="form-control" id="expiryDate" placeholder="MM/YY" maxlength="5">
                        </div>
                        <div class="col mb-3">
                            <label>CVV</label>
                            <input type="text" class="form-control" id="cvv" placeholder="123" maxlength="3">
                        </div>
                    </div>

                    <div id="error-msg" class="text-danger mb-3"></div>

                    <div class="text-center">
                        <button class="btn btn-success w-100" onclick="validatePayment()">Pay Now</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Success Message -->
        <div id="success-msg" class="text-center mt-4" style="display:none;">
            <div class="alert alert-success">
                <h3>✅ Payment Successful!</h3>
                <p>Thank you for your order. Please wait for a confirmation call.</p>
            </div>
        </div>

    </div>

    <script>
        function validatePayment() {
            //input value from the form
            let fullName = document.getElementById('fullName').value;
            let phone = document.getElementById('phone').value;
            let email = document.getElementById('email').value;
            let address = document.getElementById('address').value;
            let cardName = document.getElementById('cardName').value;
            let cardNumber = document.getElementById('cardNumber').value;
            let expiryDate = document.getElementById('expiryDate').value;
            let cvv = document.getElementById('cvv').value;
            let order

            // If customer miss any basic fields, pop will show wrong and stop.
            if (fullName === "" || phone === "" || email === "" || address === "" || cardName === "") {
                alert("❌ Missing Information: Please fill in all customer details and cardholder name.");
                return;
            }

            if (email.indexOf("@") === -1) {
                alert("❌ Invalid Email: Your email must contain an '@' symbol.");
                return; 
            }

            if (cardNumber.length < 16) {
                alert("❌ Card Error: Card number must be exactly 16 digits.");
                return;
            }

            //CVV check
            if (cvv === "") {
                cvv = prompt("You forgot your CVV! Please enter your 3-digit CVV code here:");
                
                // cvv length check
                if (cvv === null || cvv.length < 3) {
                    alert("❌ Payment cancelled: A valid 3-digit CVV is required.");
                    return;
                }
            }

            //final confirmation before payment
            let processPayment = confirm("Are you sure you want to process this payment now?");

            if (processPayment) {
                document.getElementById('error-msg').innerHTML = "";
                document.getElementById('success-msg').style.display = "block";
            } else {
                // If they click 'Cancel'
                alert("❌ Transaction paused. No bill was paid");
            }
        }
    </script>

</body>
<footer class="bg-dark text-light text-center mb-0 py-2">
    <span class="container text-md-left">
        <a href="https://www.facebook.com/food.station" target="_blank"><img src="/img-mp/facebook.png" alt="Facebook" width="30" height="30"></a>
        <a href="https://www.instagram.com/food.station" target="_blank"><img src="/img-mp/instagram.png" alt="Instagram" width="30" height="30"></a>
    </span>
    <span>  
        <p class="mb-0 text-secondary small">© 2024 Food Station. All rights reserved.</p>
    </span>
</footer>
</html>
